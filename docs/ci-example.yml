name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-node-${{ matrix.node }}
          path: releases/*.tgz
